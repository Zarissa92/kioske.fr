<!DOCTYPE html>
<html lang="fr" ${attributs_html} style="${variables_html}">
<head>
<meta charset="UTF-8">
<meta http-equiv="content-language" content="fr">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${titre}</title>
<meta name="description" content="${description}">
<link rel="canonical" href="${adresse_canonique}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="${nom_site}">
<meta property="og:title" content="${titre}">
<meta property="og:description" content="${description}">
<meta property="og:url" content="${adresse_canonique}">
${meta_og_image}
${meta_og_dimensions}
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="${titre}">
<meta name="twitter:description" content="${description}">
${meta_twitter_image}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KiosKe.fr">
<style>${css}</style>
${script_theme}
<script type="application/json" id="kioske-donnees">${donnees_json}</script>
<script>
${js_donnees_accueil}</script>
<script>
${js_service_worker}</script>
</head>
<body class="page-article">
${barre_haut}
${panneaux_communs}
<main class="panel panel-article" data-summary="${description}">
  <button id="btn-retour" class="btn-retour" aria-label="Retour">← Retour</button>
  <article>
    ${media}
    <p class="meta">${date}${site_origine} · ${source}</p>
    <h1>${titre}</h1>
    <p class="article-texte">${contenu}</p>
    <p><a class="article-lien" href="${lien_origine}" target="_blank" rel="noopener noreferrer">Lire sur ${site_origine} →</a></p>
    ${boutons_navigation}
  </article>
</main>
<script>
${js_barre}${js_retour_app}${js_installation_pwa}${js_page_article}</script>
</body>
</html>
