<!DOCTYPE html>
<html lang="fr" ${attributs_html} style="${variables_html} --largeur-carte-ouverte: ${largeur_carte_ouverte}; --hauteur-carte-ouverte: 1.15;">
<head>
<meta charset="UTF-8">
<meta http-equiv="content-language" content="fr">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${titre}</title>
<meta name="description" content="${description}">
<link rel="canonical" href="${adresse_canonique}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="${nom_site}">
<meta property="og:title" content="${titre}">
<meta property="og:description" content="${description}">
<meta property="og:url" content="${adresse_canonique}">
${meta_og_image}
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="${titre}">
<meta name="twitter:description" content="${description}">
${meta_twitter_image}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KiosKe.fr">
<style>${css}</style>
${script_theme}
<script>
${js_service_worker}</script>
</head>
<body class="page-article">
<div class="recherche-globale">
  <form id="form-recherche" class="recherche-form">
    <input type="text" id="recherche-input" class="recherche" placeholder="Chercher..." aria-label="Barre de recherche globale" autocomplete="off">
    <button type="submit" class="recherche-bouton">🔍</button>
  </form>
</div>
<main class="panel panel-article">
  <button id="btn-retour" class="btn-retour" aria-label="Retour">← Retour</button>
  <article>
    ${media}
    <p class="meta">${date}${site_origine} · ${source}</p>
    <h1>${titre}</h1>
    <p class="article-texte">${contenu}</p>
    <p><a class="article-lien" href="${lien_origine}" target="_blank" rel="noopener noreferrer">Lire sur ${site_origine} →</a></p>
    ${boutons_navigation}
  </article>
</main>
<script src="/app.js" defer></script>
<script>
${js_retour_app}
${js_page_article}</script>
</body>
</html>
