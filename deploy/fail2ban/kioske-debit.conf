# Filtre fail2ban : dépassements du débit autorisé par nginx (réponses 429).
# nginx limite chaque adresse IP à 10 pages par seconde et 100 fichiers par seconde, avec une marge
# (voir deploy/deployer_nginx.sh, zones kioske_pages et kioske_fichiers). Un visiteur n'y arrive pas ;
# un aspirateur de site, si.
# Test : sudo fail2ban-regex /var/log/nginx/kioske.fr.access.log /chemin/vers/kioske-debit.conf

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[^"]*" 429\b

ignoreregex =
