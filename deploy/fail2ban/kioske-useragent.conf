# Filtre fail2ban : robots qui se présentent avec le user-agent d'un outil de scan connu (RootEvidence).
# Ces robots ne cherchent pas une page précise : c'est le user-agent qui les trahit, quel que soit le chemin.
# Liste des user-agents bannis : RootEvidence, ShapBot, RiverBot (ajouter ici un nouveau nom, dans le même motif).
# Lit le journal nginx au format « combined » (le user-agent est le dernier champ entre guillemets).
# Test avant installation :
#   sudo fail2ban-regex /var/log/nginx/kioske.fr.access.log /chemin/vers/kioske-useragent.conf
#
# Casse ignorée (« RootEvidence », « rootevidence », « ShapBot »…). Le nom peut apparaître n'importe où dans le user-agent.

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[^"]*" \d{3} \d+ "[^"]*" "[^"]*(?:[Rr]oot[Ee]vidence|[Ss]hap[Bb]ot|[Rr]iver[Bb]ot)[^"]*"

ignoreregex =
