# Jails fail2ban du site. Installées par « deploy/kioske.sh fail2ban » dans
# /etc/fail2ban/jail.d/kioske.local, où __DOMAINE__ et __IP_JAMAIS_BANNIES__ sont remplacés par les
# valeurs de kioske.cfg ([site] domaine, [serveur] ip_jamais_bannies).
#
# Le ban est appliqué par nginx (action nginx-geo-ban, installée par f2b.sh) : l'adresse bannie reçoit
# la page « Tu es banni » sur tous les sites qui incluent le snippet. Le SSH n'est pas concerné.
# À chaque récidive, la durée du ban double (bantime.increment), jusqu'à un an.
#
#   Voir les bans      : sudo fail2ban-client status kioske-scan        (ou une autre jail)
#   Débannir une IP    : sudo fail2ban-client unban <IP>                (toutes les jails)
#   Assouplir          : augmenter maxretry ou réduire bantime ci-dessous, puis relancer
#                        « deploy/kioske.sh fail2ban »

# Sondes connues (fichiers cachés, PHP, WordPress, consoles…) : bannie à la première demande, 30 jours.
[kioske-scan]
enabled   = true
port      = http,https
filter    = kioske-scan
logpath   = /var/log/nginx/__DOMAINE__.access.log
maxretry  = 1
findtime  = 1d
bantime   = 30d
bantime.increment = true
bantime.maxtime   = 52w
banaction = nginx-geo-ban
ignoreip  = __IP_JAMAIS_BANNIES__

# Adresses que le site ne produit pas : 3 en 10 minutes, ban d'un jour.
# (Une faute de frappe ou un vieux lien ne suffit pas ; un robot qui tâtonne, si.)
[kioske-hors-site]
enabled   = true
port      = http,https
filter    = kioske-hors-site
logpath   = /var/log/nginx/__DOMAINE__.hors-site.log
maxretry  = 3
findtime  = 10m
bantime   = 1d
bantime.increment = true
bantime.maxtime   = 52w
banaction = nginx-geo-ban
ignoreip  = __IP_JAMAIS_BANNIES__

# Requêtes illisibles et méthodes autres que GET/HEAD : 2 en un jour, ban de 7 jours.
[kioske-interdit]
enabled   = true
port      = http,https
filter    = kioske-interdit
logpath   = /var/log/nginx/__DOMAINE__.access.log
maxretry  = 2
findtime  = 1d
bantime   = 7d
bantime.increment = true
bantime.maxtime   = 52w
banaction = nginx-geo-ban
ignoreip  = __IP_JAMAIS_BANNIES__

# Aspiration du site : 30 réponses 429 en une minute, ban d'une heure.
[kioske-debit]
enabled   = true
port      = http,https
filter    = kioske-debit
logpath   = /var/log/nginx/__DOMAINE__.access.log
maxretry  = 30
findtime  = 1m
bantime   = 1h
bantime.increment = true
bantime.maxtime   = 52w
banaction = nginx-geo-ban
ignoreip  = __IP_JAMAIS_BANNIES__
