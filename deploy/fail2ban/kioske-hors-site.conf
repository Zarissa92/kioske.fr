# Filtre fail2ban : demandes d'adresses que le site ne produit pas.
# nginx ne sert que les adresses du build (voir deploy/deployer_nginx.sh, « liste blanche ») ; toute autre
# demande reçoit 404 et une ligne dans /var/log/nginx/<domaine>.hors-site.log. Chaque ligne de ce
# journal compte donc. N'y arrivent pas : les pages d'article ou de catégorie disparues, favicon.ico,
# apple-touch-icon…, /.well-known/ (404 ordinaires, dans le journal d'accès seulement).
# Test : sudo fail2ban-regex /var/log/nginx/kioske.fr.hors-site.log /chemin/vers/kioske-hors-site.conf

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "

ignoreregex =
