# Filtre fail2ban : demandes qu'un navigateur ne fait jamais sur un site statique.
#   400 : requête illisible (octets bruts, TLS envoyé sur le port 80, en-têtes géants)
#   405 : autre méthode que GET ou HEAD (POST, PUT, DELETE, PROPFIND, CONNECT…)
#   413, 414 : envoi de données, adresse démesurée
# Lit le journal d'accès nginx (format « combined »).
# Test : sudo fail2ban-regex /var/log/nginx/kioske.fr.access.log /chemin/vers/kioske-interdit.conf

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[^"]*" (?:400|405|413|414)\b

ignoreregex =
