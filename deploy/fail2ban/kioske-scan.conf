# Filtre fail2ban : sondes du site (fichiers cachés, scripts et archives, pages d'administration).
# Le site est statique et n'a aucune de ces adresses : une seule demande suffit à reconnaître un robot.
# Lit le journal nginx au format « combined ». Test avant installation :
#   sudo fail2ban-regex /var/log/nginx/kioske.fr.access.log /chemin/vers/kioske-scan.conf
#
# Ce qui ne compte jamais : une réponse 200 ou 304 ; /.well-known/ (Let's Encrypt, security.txt…) ;
# une page d'article ou de catégorie disparue (404 sur /articles/… ou /categories/…) ; le texte d'une
# recherche ou d'un retour (ce qui suit le « ? » n'est pas lu).

[Definition]

# fail2ban retire la date de la ligne avant de comparer : entre les crochets il ne reste rien,
# d'où « \[[^\]]*\] » (accepte les crochets vides comme pleins).

# Réponses qui comptent : redirection HTTP→HTTPS (301), refus et erreurs (400 à 405), débit (429), 444
codes = (?:301|400|403|404|405|429|444)
# (« \s » et non une espace en fin de ligne : fail2ban retire les espaces finales des réglages)
debut = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+\s

# 1. Fichier ou dossier caché, n'importe où dans le chemin : /.env, /.git/config, /site/.aws/…
# 2. Extension qu'un site statique n'a pas : scripts, bases, sauvegardes, archives, clés, réglages
# 3. Premier dossier du chemin connu des scanners : WordPress, phpMyAdmin, consoles, API, outils
failregex = %(debut)s[^"? ]*/\.(?!well-known/)[^"]*" %(codes)s\b
            %(debut)s[^"? ]*\.(?:php\d?|phtml|phar|asp|aspx|ashx|jsp|jspx|do|action|cgi|pl|sh|bash|sql|sqlite|db|mdb|bak|backup|old|orig|save|swp|env|ini|conf|cfg|ya?ml|toml|log|pem|key|crt|p12|pfx|zip|tar|gz|tgz|bz2|rar|7z|war|jar|exe|dll)\b[^"]*" %(codes)s\b
            %(debut)s/(?:wp-[a-z]+|wordpress|wp|xmlrpc|phpmyadmin|pma|myadmin|adminer|cgi-bin|vendor|node_modules|actuator|solr|owa|autodiscover|ecp|boaform|HNAP1|GponForm|manager|server-status|server-info|telescope|_ignition|_profiler|debug|console|jenkins|hudson|struts|jmx-console|shell|webshell|backup|backups|dump|config|configuration|admin|administrator|login|signin|api|graphql|remote|sdk|portal|setup|install|cms|joomla|drupal|magento|laravel|symfony|owncloud|nextcloud|roundcube|webmail|cpanel|plesk|webdav|druid|nacos|geoserver|zabbix|grafana|kibana|prometheus|metrics|swagger|swagger-ui|api-docs|v1|v2|env|git|svn)(?:[/?." ])[^"]*" %(codes)s\b

# Jamais une sonde : les variantes du plan du site que demandent les moteurs de recherche (sitemap.xml.gz…)
ignoreregex = "[A-Z]+\s/(?:sitemap[\w.-]*|robots\.txt)(?:[?" ]|$)
