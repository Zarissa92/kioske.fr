# Configuration nginx pour kioske.fr et www.kioske.fr
# À copier sur le serveur et inclure dans nginx
# Usage : include /etc/nginx/snippets/kioske.nginx.conf;

# Langue du site : en-tête Content-Language sur les pages HTML seulement. Une valeur vide n'envoie pas
# l'en-tête (images, scripts, flux…). Lu par un seul add_header au niveau « server ».
map $sent_http_content_type $kioske_langue {
    ~^text/html                       "fr";
    default                           "";
}

# Redirection HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kioske.fr www.kioske.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kioske.fr$request_uri;
    }
}

# HTTPS kioske.fr (domaine principal)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kioske.fr;

    ssl_certificate     /etc/letsencrypt/live/kioske.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioske.fr/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_early_data      off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Language $kioske_langue;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    root /var/www/kioske.fr;
    index index.html;

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/kioske.fr.access.log;
    error_log  /var/log/nginx/kioske.fr.error.log;
}

# Redirection www.kioske.fr -> kioske.fr
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kioske.fr;

    ssl_certificate     /etc/letsencrypt/live/kioske.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioske.fr/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_early_data      off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    location / {
        return 301 https://kioske.fr$request_uri;
    }
}
