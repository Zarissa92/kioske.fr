# Configuration nginx pour kioske.fr
# Généré manuellement avec support PWA complet
# À déployer : copier dans /etc/nginx/sites-available/kioske.fr

server {
    listen 80;
    listen [::]:80;
    server_name kioske.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kioske.fr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kioske.fr;

    include /etc/nginx/snippets/fail2ban-banni.conf;

    # Certificats Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/kioske.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioske.fr/privkey.pem;

    # TLS 1.3 seulement
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_early_data      off;

    # HSTS : 1 an
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Sécurité générale
    server_tokens off;

    # Méthodes : GET/HEAD seulement
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    root /var/www/kioske.fr;
    index index.html;

    # Fichiers cachés : refusés
    location ~ /\. {
        deny all;
        return 404;
    }

    # Service worker : pas de cache (mis à jour à chaque fois)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Manifest PWA : cache 1 jour
    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "application/manifest+json" always;
        try_files $uri =404;
    }

    # Icônes PWA : cache 1 an
    location ~ /icon-[0-9]+\.png$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Assets statiques (CSS, JS, fonts) : cache 1 an
    location ~ \.(css|js|woff2|woff|ttf|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images : cache 30 jours
    location ~ /img/ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Pages HTML : cache 30 min (durée du timer de mise à jour)
    location ~ \.html$ {
        add_header Cache-Control "public, max-age=1800, must-revalidate" always;
        try_files $uri =404;
    }

    # Flux RSS/XML : pas de cache
    location ~ \.xml$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Route par défaut
    location / {
        try_files $uri $uri/ =404;
    }

    # Logs
    access_log /var/log/nginx/kioske.fr.access.log;
    error_log  /var/log/nginx/kioske.fr.error.log;
}
