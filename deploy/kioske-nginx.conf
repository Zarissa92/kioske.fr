# Configuration nginx de kioske.fr (HTTPS). Copiée par deploy/deployer_nginx_simple.sh dans
# /etc/nginx/sites-available/kioske.fr, sans toucher aux certificats.
# Même contenu que ce qu'écrit deploy/deployer_nginx.sh : modifier les deux ensemble.

# Durée de cache selon le fichier demandé. Une seule variable, lue par un seul add_header au niveau
# « server » : dans nginx, un add_header placé dans un bloc « location » annule tous ceux du niveau
# « server » (HSTS, politique de contenu…). Aucun bloc « location » ne doit donc contenir d'add_header.
map $uri $kioske_cache_control {
    # Service worker : toujours revérifié
    /sw.js                            "no-cache, must-revalidate, max-age=0";
    # Manifest PWA : 1 jour
    /manifest.json                    "public, max-age=86400";
    # Articles des panneaux de l'accueil : changent avec chaque build, comme la page qui les appelle
    /donnees-accueil.json             "no-cache, must-revalidate, max-age=0";
    # Icônes PWA : 1 an
    ~/icon-[0-9]+\.png$               "public, max-age=31536000, immutable";
    # Images de la veille : 30 jours
    ~/img/                            "public, max-age=2592000";
    # Feuilles de thème (style_<thème>.css) : le nom ne change pas à la mise à jour, donc revérifiées à chaque chargement
    ~^/style[A-Za-z0-9_-]*\.css$      "no-cache, must-revalidate, max-age=0";
    # Polices, favicon : 1 an
    ~\.(css|woff2|woff|ttf|svg)$      "public, max-age=31536000, immutable";
    # Flux RSS/XML : toujours revérifiés
    ~\.xml$                           "no-cache, must-revalidate, max-age=0";
    # Pages du Menu (statiques) : revérifiées, le contenu change à chaque publication
    ~^/menu(/|$)                      "no-cache, must-revalidate, max-age=0";
    # Pages HTML (articles, catégories, flux, dossiers) : revérifiées à chaque visite. Sinon une page en cache
    # garde l'ancien JavaScript (notifications, thèmes) jusqu'à 30 min, et Ctrl+Maj+R ne suffit pas toujours.
    # Bundle JavaScript (/js/kioske.<empreinte>.js) : le nom change avec le contenu, donc cache longue durée
    ~^/js/kioske\.[0-9a-f]+\.js$     "public, max-age=31536000, immutable";
    ~\.html$                          "no-cache, must-revalidate, max-age=0";
    ~/$                               "no-cache, must-revalidate, max-age=0";
    # theme.js, index des articles, autres : 30 min (durée du timer de mise à jour)
    default                           "public, max-age=1800, must-revalidate";
}

# Langue du site : en-tête Content-Language sur les pages HTML seulement. Une valeur vide n'envoie pas
# l'en-tête (images, scripts, flux…). Lu par un seul add_header au niveau « server », comme le cache.
map $sent_http_content_type $kioske_langue {
    ~^text/html                       "fr";
    default                           "";
}

# Débit par adresse IP. Deux compteurs : les pages (HTML, JSON, flux), qu'un visiteur demande une à une,
# et les fichiers (images, polices, scripts, icônes), qu'une seule page demande par dizaines.
# Au-delà : réponse 429, que la jail fail2ban kioske-debit compte.
limit_req_zone  $binary_remote_addr zone=kioske_pages:10m      rate=10r/s;
limit_req_zone  $binary_remote_addr zone=kioske_fichiers:10m   rate=100r/s;
limit_conn_zone $binary_remote_addr zone=kioske_connexions:10m;

# Robots : limite basse (30 pages/min, rafale 10) pour les clients qui se présentent comme des robots ou des scripts.
# Clé = adresse IP pour eux, vide pour les autres : une clé vide n'est pas comptée, les navigateurs ne sont pas freinés.
# Au-delà : 429, compté par la jail fail2ban kioske-debit comme les autres.
map $http_user_agent $kioske_cle_robot {
    default "";
    ""      $binary_remote_addr;
    ~*(bot|crawl|spider|slurp|scrapy|python-requests|python-urllib|aiohttp|httpx|curl|wget|go-http-client|java/|libwww|okhttp|axios|node-fetch|headless|phantomjs|gptbot|claudebot|ccbot|bytespider|amazonbot|perplexitybot|meta-externalagent|petalbot|semrush|ahrefs|mj12bot|dotbot) $binary_remote_addr;
}
limit_req_zone $kioske_cle_robot zone=kioske_robots:10m rate=30r/m;

# Robots d'IA (même liste que ROBOTS_IA dans kioske/construction.py, qui leur demande Crawl-delay: 10) :
# 6 pages/min, soit une toutes les 10 secondes. S'ajoute à la limite des robots (30/min) : la plus stricte joue.
# Clé = le nom du robot (capture $1), pas l'adresse IP : Amazonbot et d'autres changent d'IP (AWS) à chaque requête,
# une limite par IP ne les freinait jamais. Toutes les IP d'un même robot partagent donc le même compteur.
# Les 429 restent rares par IP : kioske-debit (60 en 10 min par IP) ne bannit pas toutes les plages du robot.
map $http_user_agent $kioske_cle_robot_ia {
    default "";
    "~*(gptbot|chatgpt-user|claudebot|claude-web|anthropic-ai|ccbot|bytespider|perplexitybot|perplexity-user|amazonbot|meta-externalagent|meta-externalfetcher|facebookbot|cohere-ai|cohere-training-data-crawler|diffbot|omgilibot|omgili|imagesiftbot|youbot|ai2bot|timpibot|mistralai-user|img2dataset|duckassistbot|pangubot|kangaroo bot|webzio-extended|velenpublicwebcrawler)" $1;
}
limit_req_zone $kioske_cle_robot_ia zone=kioske_robots_ia:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kioske.fr;

    include /etc/nginx/snippets/fail2ban-banni.conf; # fail2ban-banni

    server_tokens off;

    # Compression : le HTML de l'accueil (3 Mo) et des articles passe en gzip (texte seulement).
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript text/javascript application/json application/rss+xml application/xml image/svg+xml text/plain;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kioske.fr$request_uri;
    }

    # Même journal que le HTTPS : les sondes faites en HTTP comptent aussi pour fail2ban
    access_log /var/log/nginx/kioske.fr.access.log;
    error_log  /var/log/nginx/kioske.fr.error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kioske.fr;

    include /etc/nginx/snippets/fail2ban-banni.conf; # fail2ban-banni

    ssl_certificate     /etc/letsencrypt/live/kioske.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioske.fr/privkey.pem;
    # TLS 1.3 seul : TLS 1.0, 1.1 et 1.2 sont refusés. (Pour réaccepter 1.2, ajouter « TLSv1.2 » ici.)
    ssl_protocols       TLSv1.3;
    # Courbes elliptiques modernes uniquement ; pas de DH classique, pas de reprise de session par ticket.
    ssl_ecdh_curve      X25519:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    # 0-RTT (early data) refusé : pas de rejeu possible.
    ssl_early_data      off;

    # HTTPS seul, pendant un an
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Ne pas annoncer la version de nginx
    server_tokens off;

    # Compression : le HTML de l'accueil (3 Mo) et des articles passe en gzip (texte seulement).
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript text/javascript application/json application/rss+xml application/xml image/svg+xml text/plain;

    # Site statique : seules les lectures sont acceptées
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Site statique : aucun envoi de données, connexions courtes, peu de connexions par adresse IP
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    limit_conn kioske_connexions 40;
    limit_conn_status 429;
    limit_req_status 429;

    # En-têtes de sécurité (always : aussi sur les réponses d'erreur)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    # Durée de cache : voir la table « map » en tête de fichier. Sans « always » : pas sur les erreurs.
    add_header Cache-Control $kioske_cache_control;
    # Langue des pages (français) : voir la table « map » en tête de fichier.
    add_header Content-Language $kioske_langue;

    root __RACINE_WEB__;
    index index.html;

    # ---------------------------------------------------------------------------------------------
    # Le site est statique : seules les adresses que le build produit sont servies. Tout le reste
    # tombe dans « location / » tout en bas (404, et une ligne dans le journal hors-site que lit
    # fail2ban). En ajoutant un fichier ou un dossier à la racine du site, l'ajouter ici aussi.
    # ---------------------------------------------------------------------------------------------

    # Page 404 du site (static/404.html, publiée à la racine). Le code reste 404 : le journal et fail2ban
    # comptent toujours la requête comme une adresse inexistante. « internal » : la page n'est pas
    # servie directement, seulement comme réponse à une 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        try_files /404.html =404;
    }

    # Accueil
    location = / {
        limit_req zone=kioske_pages burst=40 nodelay;
        limit_req zone=kioske_robots burst=10 nodelay;
        limit_req zone=kioske_robots_ia burst=3 nodelay;
        try_files /index.html =404;
    }

    # Pages et données à la racine : accueil, page des flux, flux RSS, plan du site, index de recherche
    location ~ ^/(index\.html|rss\.html|hors-ligne\.html|code-de-conduite\.html|rss\.xml|plus-lus\.xml|sitemap\.xml|robots\.txt|articles-index\.json|donnees-accueil\.json)$ {
        limit_req zone=kioske_pages burst=40 nodelay;
        limit_req zone=kioske_robots burst=10 nodelay;
        limit_req zone=kioske_robots_ia burst=3 nodelay;
        try_files $uri =404;
    }

    # Pages d'article et de catégorie : /articles/<id>-<titre>/ et /categories/<nom>/
    location ~ ^/(articles|categories)/[a-z0-9-]+(/|/index\.html)?$ {
        limit_req zone=kioske_pages burst=40 nodelay;
        limit_req zone=kioske_robots burst=10 nodelay;
        limit_req zone=kioske_robots_ia burst=3 nodelay;
        try_files $uri $uri/ =404;
    }

    # Images des documents du Menu (copiées au build, à côté des documents : menu/img/, image.png…)
    location ~* ^/menu/.+\.(png|jpe?g|gif|webp|avif)$ {
        limit_req zone=kioske_fichiers burst=300 nodelay;
        try_files $uri =404;
    }

    # Pages du Menu (statiques, produites par le build) : /menu/ (index) et un dossier par document,
    # /menu/<catégorie>/[<sous-catégorie>/]<document>/index.html. Segments limités aux caractères des
    # slugs (a-z, 0-9, -) et trois niveaux au plus. Pas d'accolades dans cette expression (nginx les
    # prendrait pour un bloc).
    # index.html nommé : dans un bloc « location ~ », « $uri/ » seul ne sert pas l'index du dossier (404).
    location ~ ^/menu(/[a-z0-9-]+)?(/[a-z0-9-]+)?(/[a-z0-9-]+)?/?$ {
        limit_req zone=kioske_pages burst=40 nodelay;
        limit_req zone=kioske_robots burst=10 nodelay;
        limit_req zone=kioske_robots_ia burst=3 nodelay;
        try_files $uri $uri/index.html =404;
    }

    # Ancienne adresse du Menu (/ressources/…, renommée /menu/… le 2026-11-19) : redirection permanente.
    # Garde les liens déjà partagés et les notifications enregistrées dans les navigateurs.
    location ~ ^/ressources(/.*)?$ {
        limit_req zone=kioske_pages burst=40 nodelay;
        limit_req zone=kioske_robots burst=10 nodelay;
        limit_req zone=kioske_robots_ia burst=3 nodelay;
        return 301 /menu$1$is_args$args;
    }

    # Ancienne page des dispositions légales (static/, avant le 2026-11-19) : elle est dans le Menu.
    location = /dispositions-legales.html {
        limit_req zone=kioske_pages burst=40 nodelay;
        limit_req zone=kioske_robots burst=10 nodelay;
        limit_req zone=kioske_robots_ia burst=3 nodelay;
        return 301 /menu/dispositions-legales/;
    }

    # Anciens flux RSS par catégorie (/rss/<nom>.xml, supprimés) : redirection vers le flux unique
    location ~ ^/rss/[a-z0-9-]+\.xml$ {
        limit_req zone=kioske_pages burst=40 nodelay;
        limit_req zone=kioske_robots burst=10 nodelay;
        limit_req zone=kioske_robots_ia burst=3 nodelay;
        return 301 /rss.xml;
    }

    # Manifest PWA : type MIME des manifestes
    location = /manifest.json {
        limit_req zone=kioske_fichiers burst=300 nodelay;
        types { }
        default_type application/manifest+json;
    }

    # Bundle JavaScript des pages (/js/kioske.<empreinte>.js) : sans cette règle, la liste blanche le renvoie en 404.
    # Le cache longue durée vient de la table map (immutable), comme le reste.
    location ~ ^/js/kioske\.[0-9a-f]+\.js$ {
        limit_req zone=kioske_fichiers burst=300 nodelay;
        try_files $uri =404;
    }

    # Scripts, icônes et image de partage à la racine
    location ~ ^/(theme\.js|pluie\.js|sw\.js|favicon\.svg|preview\.png|apple-touch-icon\.png|icon-[0-9]+\.png)$ {
        limit_req zone=kioske_fichiers burst=300 nodelay;
        try_files $uri =404;
    }

    # Feuilles de style des thèmes (style_<thème>.css, chargées par theme.js à chaque page).
    # Sans cette règle, elles tombent dans « location / » : 404 comptés par fail2ban (kioske-hors-site),
    # et trois pages suffisent pour bannir le visiteur (page « Tu es banni » sur tout le site).
    location ~ ^/style[A-Za-z0-9_-]*\.css$ {
        limit_req zone=kioske_fichiers burst=300 nodelay;
        try_files $uri =404;
    }

    # Images de la veille et polices
    location ~ ^/(img/veille|img/previews|fonts)/[A-Za-z0-9._-]+$ {
        limit_req zone=kioske_fichiers burst=300 nodelay;
        try_files $uri =404;
    }

    # Fichiers que navigateurs et robots demandent d'eux-mêmes et que le site n'a pas : 404 ordinaire,
    # sans passer par le journal hors-site (un visiteur ne doit pas être banni pour un favicon.ico).
    location ~ ^/(favicon\.ico|favicon\.png|apple-touch-icon[a-z0-9-]*\.png|browserconfig\.xml|ads\.txt|app-ads\.txt|humans\.txt|security\.txt|fonts/?)$ {
        return 404;
    }
    location ^~ /.well-known/ {
        return 404;
    }

    # Fichiers cachés (.git, .env…) : refusés (la jail kioske-scan bannit à la première demande)
    location ~ /\. {
        return 404;
    }

    # Tout le reste n'existe pas sur ce site
    location / {
        access_log /var/log/nginx/kioske.fr.access.log;
        access_log /var/log/nginx/kioske.fr.hors-site.log;
        return 404;
    }

    access_log /var/log/nginx/kioske.fr.access.log;
    error_log  /var/log/nginx/kioske.fr.error.log;
}
