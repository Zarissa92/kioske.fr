# Réglages de kioske.fr (format INI). Un seul fichier pour le site, la veille et le serveur.
# Lu par le paquet Python kioske/ (kioske/config.py) et par les scripts de deploy/ (deploy/lib_config.sh).
# Après une modification : reconstruire (bin/build_site.py --simple), puis publier.

[site]
domaine = kioske.fr
nom = KiosKe
# Phrase d'accroche : sert au titre de l'onglet et aux moteurs de recherche.
slogan = veille des médias indépendants, des luttes et des voix LGBTQIA+
# Thème affiché par défaut (une des sections [theme.<nom>] ci-dessous).
theme = pluie
# Taille globale du site : zoom en % (min 75, max 125), 100 = taille de base, 115 = optimisé pour 1920x1080.
taille_defaut = 125
# Largeur maximale d'une carte ouverte (article ou catégorie). Ex: 600px, 80vw, min(700px, 90vw)
largeur_carte_ouverte = min(600px, 85vw)
# Hauteur d'une carte ouverte : zoom en % (min 75, max 125), 100 = taille de base, 115 = optimisé pour 1920x1080.
hauteur_carte_ouverte = 75

[veille]
# Nombre d'articles dans chaque flux RSS produit (rss.xml et rss/<catégorie>.xml).
articles_flux_rss = 100
# Nombre de vidéos regardées par chaîne Twitch (un appel réseau par vidéo).
videos_par_chaine = 15
# Nombre d'articles affichés par source, les plus récents d'abord. 0 = tous (la base n'est jamais purgée).
articles_par_source = 0
# Une image ou un aperçu en échec est réessayé après ce délai.
delai_nouvel_essai_heures = 24

[serveur]
# Dossier servi par nginx : la publication y copie le contenu de build/.
racine_web = /var/www/kioske.fr
# IP publique attendue pour le domaine (contrôle de deploy/verifier_serveur.sh).
ip_publique = 86.238.75.39
# Fréquence du timer systemd kioske-veille (format systemd : 30min, 1h…). Relancer deploy/installer_serveur.sh après un changement.
intervalle_timer = 30min

# Un thème = une section [theme.<nom>]. Le visiteur choisit parmi tous les thèmes listés ici.
#   fond            : etoiles (nuit étoilée, bande de la Voie lactée) | noir
#   pluie           : oui | non (pluie matricielle, CSS pur)
#   opacite_panneau : opacité du fond du grand panneau principal, en % (0 = transparent, 100 = opaque)

[theme.voie_lactee]
nom = Voie lactée (nuit étoilée)
fond = etoiles
pluie = non
opacite_panneau = 45

[theme.pluie]
nom = Pluie matricielle
fond = noir
pluie = oui
opacite_panneau = 70
