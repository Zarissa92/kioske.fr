# Réglages de kioske.fr (format INI). Un seul fichier pour le site, la veille et le serveur.
# Lu par le paquet Python kioske/ (kioske/config.py) et par les scripts de deploy/ (deploy/lib_config.sh).
# Après une modification : reconstruire (bin/build_site.py --simple), puis publier.

[site]
domaine = kioske.fr
nom = KiosKe.fr
# Thème affiché par défaut (une des sections [theme.<nom>] ci-dessous).
theme = default
# Afficher la galerie principale (1 = oui, 0 = non)
galerie_principale = 1
# Galeries des blocs de catégorie sur la page d'accueil (1 = oui, 0 = non). Les panneaux ouverts (tuiles, tags, titres) n'en ont jamais.
galerie_panneau = 1

[veille]
# Nombre d'articles dans chaque flux RSS produit (rss.xml et rss/<catégorie>.xml).
articles_flux_rss = 100
# Nombre de vidéos regardées par chaîne Twitch (un appel réseau par vidéo).
videos_par_chaine = 15
# Nombre d'articles affichés par source, les plus récents d'abord. 0 = tous (la base n'est jamais purgée).
articles_par_source = 0
# Une image ou un aperçu en échec est réessayé après ce délai.
delai_nouvel_essai_heures = 24

[serveur]
# Adresses que fail2ban ne bannit jamais (jails du site, deploy/fail2ban/kioske.jail.conf) : le serveur
# lui-même et le réseau local, pour ne pas se bannir en testant. Séparées par des espaces.
# Relancer « deploy/kioske.sh fail2ban » après un changement.
ip_jamais_bannies = 127.0.0.1/8 ::1 192.168.1.0/24
# Fréquence du timer systemd kioske-veille (format systemd : 30min, 1h…). Relancer deploy/installer_serveur.sh après un changement.
intervalle_timer = 30min

# Un thème = une section [theme.<nom>]. Le visiteur choisit parmi tous les thèmes listés ici.
#   fond            : etoiles (nuit étoilée, bande de la Voie lactée) | noir
#   pluie           : oui | non (pluie matricielle, fabriquée par static/theme.js)
#   opacite_panneau : opacité du fond du grand panneau principal, en % (0 = transparent, 100 = opaque)
#   css             : fichier CSS pour ce thème (optionnel, défaut : style.css)

[theme.default]
nom = Défaut
fond = noir
pluie = non
opacite_panneau = 70
css = /style_default.css

[theme.red_neon]
nom = Néon rouge
fond = noir
pluie = oui
opacite_panneau = 70
css = /style_red_neon.css
pluie_tete = #ff0000
pluie_haut = #ff1a1a
pluie_moyen = #ff6666
pluie_bas = #cc0000

[theme.white_neon]
nom = Néon blanc
fond = noir
pluie = oui
opacite_panneau = 45
css = /style_white_neon.css
pluie_tete = #ffffff
pluie_haut = #ffffff
pluie_moyen = #cccccc
pluie_bas = #999999

[theme.purple_neon]
nom = Néon violet
fond = noir
pluie = oui
opacite_panneau = 45
css = /style_purple_neon.css
pluie_tete = #8a2be2
pluie_haut = #8a2be2
pluie_moyen = #8a2be2
pluie_bas = #8a2be2

[theme.trans_neon]
nom = Drapeau trans 1
fond = noir
pluie = oui
opacite_panneau = 45
css = /style_trans_neon.css
pluie_tete = #ffffff
pluie_haut = #f5a9b8
pluie_moyen = #5bcefa
pluie_bas = #2f8fd0

[theme.trans]
nom = Drapeau trans 2
fond = noir
pluie = oui
opacite_panneau = 70
css = /style_trans.css
pluie_tete = #5BCEFA
pluie_haut = #F5A9B8
pluie_moyen = #FFFFFF
pluie_bas = #5BCEFA

[theme.etoiles]
nom = Ciel
fond = etoiles
pluie = non
opacite_panneau = 30
css = /style_etoiles.css

[reseaux]
# Liens des réseaux sociaux et ressources. Laissez vide pour désactiver.
discord = https://discord.gg/UwkxBJnX2
mastodon = https://tech.lgbt/@zarisse
rss = rss.html

[menu]
# Ordre des entrées du menu ≡ (sous le bloc des thèmes, qui reste en tête).
# Clés : sobre, flux, installer, ressources, rss, discord, mastodon, conduite.
# Une clé absente de la liste est ajoutée à la fin, dans l'ordre par défaut ; une clé inconnue arrête le build.
# rss, discord et mastodon n'apparaissent que si leur lien est renseigné dans [reseaux].
ordre = sobre, flux, installer, ressources, rss, discord, mastodon, conduite
