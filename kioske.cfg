# Réglages de kioske.fr (format INI). Un seul fichier pour le site, la veille et le serveur.
# Lu par le paquet Python kioske/ (kioske/config.py) et par les scripts de deploy/ (deploy/lib_config.sh).
# Après une modification : reconstruire (bin/build_site.py --simple), puis publier.

[site]
domaine = kioske.fr
nom = KiosKe.fr
# Thème affiché par défaut (une des sections [theme.<nom>] ci-dessous).
theme = default
# Galeries des catégories sur la page d'accueil (1 = oui, 0 = non). Les panneaux ouverts (tuiles, tags, titres) n'en ont jamais.
galerie_panneau = 1
# Galerie « Les plus lus » (au-dessus de la grande galerie) : articles les plus consultés, d'après le journal
# d'accès de nginx (aucun pistage ajouté ; une adresse IP compte une fois par article, robots et ip_jamais_bannies
# retirés). plus_lus_journal est un CHEMIN de fichier, pas un interrupteur : laisser vide pour celui de nginx
# (/var/log/nginx/<domaine>.access.log). Afficher ou masquer la galerie : galerie_plus_lus, plus bas.
# Sans journal lisible (poste de développement), la galerie n'est pas écrite.
plus_lus_journal = 
plus_lus_jours = 7
plus_lus_nombre = 15
# Galeries de l'accueil affichées par défaut (1 = affichée, 0 = masquée). Le visiteur peut changer dans
# Paramètres ; son choix l'emporte, et « Tout remettre par défaut » revient à ces valeurs.
# galeries_blocs n'a d'effet que si galerie_panneau = 1 (sinon ces galeries ne sont pas construites).
galerie_plus_lus = 1
grande_galerie = 1
galeries_blocs = 0

[veille]
# Nombre d'articles dans chaque flux RSS produit (rss.xml et rss/<catégorie>.xml).
articles_flux_rss = 100
# Nombre de vidéos regardées par chaîne Twitch (un appel réseau par vidéo).
videos_par_chaine = 15
# Nombre d'articles affichés par source, les plus récents d'abord. 0 = tous (la base n'est jamais purgée).
articles_par_source = 0
# Une image ou un aperçu en échec est réessayé après ce délai.
delai_nouvel_essai_heures = 24

[serveur]
# Adresses que fail2ban ne bannit jamais (jails du site, deploy/fail2ban/kioske.jail.conf) : le serveur
# lui-même, pour ne pas se bannir en testant. Séparées par des espaces.
# Relancer « deploy/kioske.sh fail2ban » après un changement.
ip_jamais_bannies = 127.0.0.1/8 ::1
# Adresses partagées par beaucoup de personnes, jamais bannies par les jails « sondes », « hors site » et
# « interdit » (deploy/fail2ban/kioske.jail.conf) : un seul scanner derrière l'une d'elles ferait bannir tous
# ses utilisateurs. Elles restent bannies par kioske-debit si elles inondent le site.
#   Cloudflare (app 1.1.1.1 et WARP, une partie du relais privé d'iCloud) : https://www.cloudflare.com/ips/
#   Robots de Google (Googlebot) et de Bing (Bingbot) : référencement.
# Relancer « deploy/kioske.sh fail2ban » après un changement.
ip_partagees = 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32 66.249.64.0/19 157.55.39.0/24 207.46.13.0/24 40.77.167.0/24 13.66.139.0/24 52.167.144.0/24
# Fréquence du timer systemd kioske-veille (format systemd : 30min, 1h…). Relancer deploy/installer_serveur.sh après un changement.
intervalle_timer = 30min

# Un thème = une section [theme.<nom>]. Le visiteur choisit parmi tous les thèmes listés ici.
#   fond            : noir (seul fond disponible)
#   pluie           : oui | non (pluie matricielle, fabriquée par static/theme.js)
#   opacite_panneau : opacité du fond du grand panneau principal, en % (0 = transparent, 100 = opaque)
#   css             : fichier CSS pour ce thème (optionnel, défaut : style.css)

[theme.default]
nom = Défaut
fond = noir
pluie = non
opacite_panneau = 70
css = /style_default.css

[theme.red_neon]
nom = Néon rouge
fond = noir
pluie = oui
opacite_panneau = 70
css = /style_red_neon.css
pluie_tete = #ff0000
pluie_haut = #ff1a1a
pluie_moyen = #ff6666
pluie_bas = #cc0000

[theme.white_neon]
nom = Néon blanc
fond = noir
pluie = oui
opacite_panneau = 45
css = /style_white_neon.css
pluie_tete = #ffffff
pluie_haut = #ffffff
pluie_moyen = #cccccc
pluie_bas = #999999

[theme.prune_neon]
nom = Néon prune
fond = noir
pluie = oui
opacite_panneau = 45
css = /style_prune_neon.css
pluie_tete = #993399
pluie_haut = #993399
pluie_moyen = #b366b3
pluie_bas = #662266

[theme.trans]
nom = Néon trans
fond = noir
pluie = oui
opacite_panneau = 70
css = /style_trans.css
pluie_tete = #5BCEFA
pluie_haut = #F5A9B8
pluie_moyen = #FFFFFF
pluie_bas = #5BCEFA


[panneaux]
# Ordre des panneaux de la veille (ex. : ordre = LGBT, Médias, Vidéo et radio).
# Noms exacts, comme dans sources/RSS_feeds.txt, séparés par des virgules.
# Les panneaux non cités gardent leur ordre actuel, à la suite. Vide = ordre actuel.
# Un nom qui ne correspond à aucun panneau est signalé au build et ignoré.
ordre =
